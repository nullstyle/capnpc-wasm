min_version = "2026.9.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[settings.task]
run_auto_install = false

[tool_alias.wasi-sdk]
backend = "github:WebAssembly/wasi-sdk"

[tools]
# Native bootstrap and generated C++ checks. clangxx supplies the C++ driver.
clang = "23.1.0"
"conda:clangxx" = "23.1.0"
cmake = "4.4.3"
ninja = "1.13.2"
go = "1.27.1"
deno = "2.9.6"
# Match ref/capnp-zig/mise.toml when updating that reference.
zig = "0.17.0-dev.1683+5ceec001b"
wasm-tools = "1.258.0"
wasmtime = "48.0.1"
shellcheck = "0.11.0"
# Rust exposes Cargo's user bin directory; put it after managed binaries so
# previously installed Cargo commands cannot shadow wasm-tools or other pins.
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"], targets = ["wasm32-wasip1"] }

[tools.wasi-sdk]
version = "34"
version_prefix = "wasi-sdk-"
strip_components = 1
bin_path = "bin"
# Keep the SDK's cross-compilers off PATH; use `mise where wasi-sdk` explicitly.
filter_bins = ["wasm-ld"]

[tools.wasi-sdk.platforms]
# Static mappings also resolve correctly when locking for a different host.
linux-x64 = { asset_pattern = "wasi-sdk-*-x86_64-linux.tar.gz" }
linux-arm64 = { asset_pattern = "wasi-sdk-*-arm64-linux.tar.gz" }
macos-x64 = { asset_pattern = "wasi-sdk-*-x86_64-macos.tar.gz" }
macos-arm64 = { asset_pattern = "wasi-sdk-*-arm64-macos.tar.gz" }

[env]
CC = "clang"
CXX = "clang++"
CARGO_TARGET_DIR = "{{config_root}}/build/cargo"
DENO_DIR = "{{config_root}}/.cache/deno"
GOPATH = "{{config_root}}/.cache/go"
GOCACHE = "{{config_root}}/.cache/go-build"
GOTOOLCHAIN = "local"
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.cache/zig"
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.cache/playwright"

[tasks.setup]
description = "Initialize pinned references and verify installed tools (run mise install first)"
run = [{ task = "refs:sync" }, { task = "doctor" }]

[tasks."refs:sync"]
description = "Initialize top-level reference submodules at their recorded commits"
run = ["git submodule sync", "git -c submodule.recurse=false submodule update --init"]

[tasks."refs:status"]
description = "Show the exact reference checkouts"
run = "git submodule status"

[tasks.doctor]
description = "Check tool availability, Rust WASI target, SDK layout, and reference pins"
run = "bash scripts/doctor.sh"

[tasks.check]
description = "Check formatting, tooling, and native/Wasm parity across the test hosts"
run = [
  "shellcheck scripts/*.sh",
  "deno fmt --check README.md AGENTS.md ref/README.md patches/capnproto/README.md generators/README.md tests sdk examples scripts/*.ts",
  "deno lint tests sdk/typescript examples scripts/*.ts",
  "deno check --config tests/hosts/deno/deno.json --unstable-sloppy-imports tests/hosts/deno/main.ts",
  "go -C tests/hosts/wazero vet ./...",
  "go -C generators/go vet capnproto.org/go/capnp/v3/capnpc-go",
  "go -C sdk/go vet -stdmethods=false ./...",
  "deno check --config sdk/typescript/deno.json --unstable-sloppy-imports sdk/typescript/mod.ts sdk/typescript/worker.ts",
  "deno check --config tests/browser/deno.json --frozen tests/browser/test.ts tests/browser/install.ts",
  "cargo fmt --manifest-path generators/rust/Cargo.toml -- --check",
  "cargo fmt --manifest-path tests/consumers/rust/Cargo.toml -- --check",
  "cargo clippy --locked --manifest-path generators/rust/Cargo.toml --all-targets -- -D warnings",
  { task = "doctor" },
  { task = "test" },
]

[tasks."build:native"]
description = "Build the pristine upstream native tools and test oracle"
run = "bash scripts/build-native.sh"

[tasks."build:wasm"]
description = "Apply the WASI port to a disposable source copy and build command modules"
run = "bash scripts/build-wasm.sh"

[tasks.build]
description = "Build native reference tools and WASI command modules"
depends = ["build:native", "build:sdk"]

[tasks."build:rust"]
description = "Build the Rust generator as native and WASI commands"
run = "bash scripts/build-rust.sh"

[tasks."build:go"]
description = "Build the Go generator as native and WASI commands"
run = "bash scripts/build-go.sh"

[tasks."build:wazero"]
description = "Build the test host from the pinned wazero reference"
run = "go -C tests/hosts/wazero build -mod=readonly -o ../../../build/hosts/wazero-run ."

[tasks.test]
description = "Compare compiler/generator behavior in Wasmtime, wazero, and the Deno browser shim"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:wazero", "build:sdk"]
run = [
  "deno test --allow-read --allow-write=build --allow-run tests/toolchain_test.ts",
  "deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read sdk/typescript/sdk_test.ts",
  "go -C sdk/go test -mod=readonly ./...",
]

[tasks."build:sdk"]
description = "Bundle the browser/Deno SDK, identical Wasm commands, and include schemas into dist"
depends = ["build:wasm", "build:rust", "build:go"]
run = "bash scripts/build-sdk.sh"

[tasks."browser:install"]
description = "Install pinned Chromium for browser tests into the project cache"
run = "deno run --config tests/browser/deno.json --frozen --allow-read --allow-write=.cache/playwright --allow-env --allow-sys --allow-net --allow-run=deno,cmake tests/browser/install.ts"

[tasks."test:browser"]
description = "Run SDK parity and worker cancellation offline in real Chromium"
depends = ["build:native", "build:sdk"]
run = "deno run --config tests/browser/deno.json --frozen --no-prompt --allow-read --allow-write=build --allow-run --allow-env --allow-sys --allow-net=127.0.0.1 tests/browser/test.ts"

[tasks."example:deno"]
description = "Generate Rust through the bundled SDK with no execution permissions"
depends = ["build:sdk"]
run = "deno run --no-prompt --allow-read=dist examples/deno.ts"

[tasks."example:browser"]
description = "Serve the browser worker example and local SDK assets"
depends = ["build:sdk"]
run = "deno run --allow-read=examples/browser,dist --allow-net=127.0.0.1:8080 scripts/serve-example.ts"

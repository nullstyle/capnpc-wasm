min_version = "2026.9.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[settings.task]
run_auto_install = false

# The pinned Zig is a development build that ziglang.org no longer serves, so
# the project keeps the ZSF-signed tarballs in its own release
# toolchain-zig-<version>. core:zig never downloads the url that mise.lock
# records: it requests https://ziglang.org/builds/<file>, or a randomly chosen
# community mirror whose .minisig must also exist (zig.bcr.ist has none), and
# then <file>.minisig from the same host. With the mirrors off, the rule below
# sends both requests to the release; mise still verifies the minisign
# signature and the sha256 in mise.lock, and the rule matches nothing but
# ziglang.org development builds. `mise run mirror:zig` stages, verifies, and
# locks a release; its lock entries name the rewritten URLs, and lint's
# `check:zig-lock` checks both tables and those entries offline. Side effects
# inside this project are listed in CONTRIBUTING.md, "Tool pins".
[settings.zig]
use_community_mirrors = false

[settings.url_replacements]
'regex:^https://ziglang\.org/builds/(zig-[a-z0-9_]+-[a-z]+-([0-9][^/?]*?)\.tar\.xz(?:\.minisig)?)(?:\?.*)?$' = "https://github.com/nullstyle/capnpc-wasm/releases/download/toolchain-zig-${2}/${1}"

[tool_alias.wasi-sdk]
backend = "github:WebAssembly/wasi-sdk"

[tools]
# Native bootstrap and generated C++ checks. clangxx supplies the C++ driver.
clang = "23.1.0"
"conda:clangxx" = "23.1.0"
cmake = "4.4.3"
ninja = "1.13.2"
go = "1.27.1"
deno = "2.9.6"
# Match ref/capnp-zig/mise.toml when updating that reference. mise installs
# this development build from the project's mirror release (see [settings.zig]
# above); mise.lock records its sha256 and minisign provenance for all four
# platforms. A bump needs the new release first: CONTRIBUTING.md, "Tool pins".
zig = "0.17.0-dev.1683+5ceec001b"
wasm-tools = "1.258.0"
wasmtime = "48.0.1"
shellcheck = "0.11.0"
# Workflow linting in `lint` (it runs shellcheck over run: scripts too).
"aqua:rhysd/actionlint" = "1.7.12"
# Rust exposes Cargo's user bin directory; put it after managed binaries so
# previously installed Cargo commands cannot shadow wasm-tools or other pins.
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"], targets = ["wasm32-wasip1"] }

[tools.wasi-sdk]
version = "34"
version_prefix = "wasi-sdk-"
strip_components = 1
bin_path = "bin"
# Keep the SDK's cross-compilers off PATH; use `mise where wasi-sdk` explicitly.
filter_bins = ["wasm-ld"]

[tools.wasi-sdk.platforms]
# Static mappings also resolve correctly when locking for a different host.
linux-x64 = { asset_pattern = "wasi-sdk-*-x86_64-linux.tar.gz" }
linux-arm64 = { asset_pattern = "wasi-sdk-*-arm64-linux.tar.gz" }
macos-x64 = { asset_pattern = "wasi-sdk-*-x86_64-macos.tar.gz" }
macos-arm64 = { asset_pattern = "wasi-sdk-*-arm64-macos.tar.gz" }

[env]
CC = "clang"
CXX = "clang++"
CARGO_TARGET_DIR = "{{config_root}}/build/cargo"
DENO_DIR = "{{config_root}}/.cache/deno"
GOPATH = "{{config_root}}/.cache/go"
# Go's default under GOPATH, stated so no user setting moves the module cache
# out of the project.
GOMODCACHE = "{{config_root}}/.cache/go/pkg/mod"
GOCACHE = "{{config_root}}/.cache/go-build"
GOTOOLCHAIN = "local"
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.cache/zig"
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.cache/playwright"
# mise starts the native builds together (two Ninja builds and Cargo), so cap
# each at about half the cores. A value already set in the environment or in
# mise.local.toml wins; MISE_JOBS or [settings] jobs bounds the tasks themselves.
CMAKE_BUILD_PARALLEL_LEVEL = "{% set half = (num_cpus() | int) / 2 %}{% if get_env(name='CMAKE_BUILD_PARALLEL_LEVEL', default='') == '' %}{{ half | round(method='ceil') | int }}{% else %}{{ get_env(name='CMAKE_BUILD_PARALLEL_LEVEL') }}{% endif %}"
CARGO_BUILD_JOBS = "{% set half = (num_cpus() | int) / 2 %}{% if get_env(name='CARGO_BUILD_JOBS', default='') == '' %}{{ half | round(method='ceil') | int }}{% else %}{{ get_env(name='CARGO_BUILD_JOBS') }}{% endif %}"
# Probe the pinned native linker on macOS and export a working SDKROOT (or
# Xcode's linker) only when the default SDK cannot link. Runs after tools so it
# sees the pinned compilers; exports nothing where the default link works.
_.source = { path = "{{config_root}}/scripts/lib/toolchain-env.sh", tools = true }

[vars]
# Shared path lists so lint and fmt check and fix the same files.
fmt_paths = "README.md AGENTS.md SECURITY.md CONTRIBUTING.md CHANGELOG.md ref/README.md patches/capnproto/README.md patches/capnp-zig/README.md generators/README.md generators/zig/README.md docs tests sdk examples scripts/*.ts"
go_dirs = "sdk/go tests/hosts/wazero tests/consumers/go tests/package"
zig_dirs = "generators/zig tests/consumers/zig tests/wire tests/reflection tests/generator_api tests/rpc_codegen"
# Environment the parity suites may read: the keep-test-dirs switch plus the
# variables they forward to native compilers and the pinned language tools,
# including what scripts/lib/toolchain-env.sh exports in its fallback mode
# (SDKROOT, LDFLAGS, the host triple's CARGO_TARGET_*_RUSTFLAGS) and
# RUSTUP_TOOLCHAIN, without which the rustup proxy runs the user default.
suite_env = "CAPNP_KEEP_TEST_DIRS,PATH,HOME,TMPDIR,CC,CXX,SDKROOT,LDFLAGS,CARGO_TARGET_DIR,CARGO_HOME,RUSTUP_HOME,RUSTUP_TOOLCHAIN,CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS,CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS,DENO_DIR,GOPATH,GOCACHE,GOMODCACHE,GOTOOLCHAIN,GOFLAGS,GOPROXY,ZIG_GLOBAL_CACHE_DIR"

[tasks.setup]
description = "Initialize pinned references and verify installed tools (run mise install first)"
run = [{ task = "refs:sync" }, { task = "doctor" }]

[tasks."refs:sync"]
description = "Initialize top-level reference submodules at their recorded commits"
run = [
  "git submodule sync",
  "git -c submodule.recurse=false submodule update --init",
  # The historical generator commit is not on the pinned branch. Fetch it only
  # when it is missing, so a later setup works offline.
  'historical="$(cat generators/zig/historical-reference)"; git -C ref/capnp-zig cat-file -e "$historical^{commit}" 2>/dev/null || git -C ref/capnp-zig fetch --no-tags origin "$historical"',
]

[tasks."refs:status"]
description = "Show the exact reference checkouts"
run = "git submodule status"

[tasks.doctor]
description = "Check tool availability, Rust WASI target, SDK layout, and reference pins"
run = "bash scripts/doctor.sh"

# Workspace hygiene. build/scratch/<name>/ is the place for probes and logs;
# clean removes it with the rest of build/.
[tasks."clean:test"]
description = "Remove test work directories (build/test) and the Zig test compile scratch (build/zig/cache/tmp)"
run = "rm -rf build/test build/zig/cache/tmp"

[tasks.clean]
description = "Remove build trees and distributable output (build/ including build/scratch, and dist/); keeps .cache/"
run = "rm -rf build dist"

[tasks."clean:all"]
description = "Remove build/, dist/, and every project cache under .cache/ (Deno, Go, Zig, downloaded browsers)"
# Go extracts modules read-only; go clean removes them where rm alone fails.
run = [
  "command -v go >/dev/null && go clean -modcache || true",
  # Without Go on PATH the module cache is still read-only. find does not
  # follow a symlinked .cache, and rm then removes only the link.
  "find .cache -type d -exec chmod u+w {} + 2>/dev/null || true",
  "rm -rf build dist .cache",
]

[tasks.lint]
description = "Static checks without a build: shell, formatting, lint, type checks, vet, clippy"
run = [
  "shellcheck bin/capnp-wasm $(find scripts -name '*.sh')",
  # Every workflow under .github/workflows, with shellcheck over run: scripts.
  "actionlint",
  "deno fmt --check {{vars.fmt_paths}}",
  "deno lint tests sdk/typescript examples scripts/*.ts",
  # examples/deno.ts imports the built dist/ bundle; example:deno, which test
  # depends on, type-checks it with --check after build:sdk.
  "deno check scripts/*.ts",
  "deno check --config tests/hosts/deno/deno.json --unstable-sloppy-imports tests/hosts/deno/main.ts",
  "deno check --config sdk/typescript/deno.json --unstable-sloppy-imports sdk/typescript/mod.ts sdk/typescript/worker.ts",
  "deno check --config sdk/typescript/deno.strict.json sdk/typescript/*.ts sdk/typescript/testdata/*.ts",
  "deno check --config tests/browser/deno.json --frozen tests/browser/test.ts tests/browser/install.ts tests/browser/run.ts tests/browser/studio.ts",
  'unformatted="$(gofmt -l {{vars.go_dirs}})" && test -z "$unformatted" || { echo "gofmt -l: $unformatted"; exit 1; }',
  "go -C tests/hosts/wazero vet ./...",
  "go -C generators/go vet capnproto.org/go/capnp/v3/capnpc-go",
  "go -C sdk/go vet -stdmethods=false ./...",
  "cargo fmt --manifest-path generators/rust/Cargo.toml -- --check",
  "cargo fmt --manifest-path tests/consumers/rust/Cargo.toml -- --check",
  "cargo clippy --locked --manifest-path generators/rust/Cargo.toml --all-targets -- -D warnings",
  "zig fmt --check {{vars.zig_dirs}}",
  { task = "check:links" },
  { task = "check:evidence" },
  { task = "check:zig-lock" },
]

[tasks.fmt]
description = "Apply the formatters that lint checks: deno fmt, gofmt, cargo fmt, zig fmt"
run = [
  "deno fmt {{vars.fmt_paths}}",
  "gofmt -l -w {{vars.go_dirs}}",
  "cargo fmt --manifest-path generators/rust/Cargo.toml",
  "cargo fmt --manifest-path tests/consumers/rust/Cargo.toml",
  "zig fmt {{vars.zig_dirs}}",
]

[tasks.check]
description = "Static checks, the tool doctor, and native/Wasm parity across the test hosts"
depends = ["lint", "doctor", "test"]

[tasks.ci]
description = "Run the CI check job locally: check, package gates, the Go race tests, browser bootstrap, then require a clean tree"
depends = [
  "check",
  "test:package",
  "test:sdk-go-race",
  "test:browser-bootstrap",
]
run = 'changes="$(git status --porcelain)" && test -z "$changes" || { echo "checks left tracked or untracked changes:"; echo "$changes"; exit 1; }'

[tasks."build:native"]
description = "Build the pristine upstream native tools and test oracle"
run = "bash scripts/build-native.sh"

[tasks."build:wasm"]
description = "Apply the WASI port to a disposable source copy and build command modules"
run = "bash scripts/build-wasm.sh"

[tasks.build]
description = "Build native reference tools and WASI command modules"
depends = ["build:native", "build:sdk"]

[tasks."build:rust"]
description = "Build the Rust generator as native and WASI commands"
run = "bash scripts/build-rust.sh"

[tasks."build:go"]
description = "Build the Go generator as native and WASI commands"
run = "bash scripts/build-go.sh"

[tasks."build:zig"]
description = "Build the pinned capnp-zig generator as native and WASI commands"
run = "bash scripts/build-zig.sh"

[tasks."check:zig-sync"]
description = "Verify prepared Zig sources and mirrored fixtures against the ref/capnp-zig gitlink"
run = "deno run --allow-read --allow-run=git scripts/check-zig-sync.ts"

[tasks."build:wazero"]
description = "Build the test host from the pinned wazero reference"
run = "go -C tests/hosts/wazero build -mod=readonly -o ../../../build/hosts/wazero-run ."

# Each suite depends only on the build outputs it reads, so mise runs the
# suites in parallel and `mise run --skip-deps test:<suite>` reruns one of them.
# The parity suites keep a broad --allow-run: they spawn wasmtime, the wazero
# host, the native tools, and the language toolchains (cargo, go, zig, clang++).
[tasks.test]
description = "Run every comparison suite: hosts, Zig, SDKs, and feature corpus (builds as needed)"
depends = [
  "test:harness",
  "test:zig-unit",
  "test:toolchain",
  "test:wire",
  "test:reflection",
  "test:generator-api",
  "test:rpc-codegen",
  "test:sdk-ts",
  "test:features",
  "test:sdk-go",
  # The Deno example imports dist/, so the type check of examples/deno.ts lives here.
  "example:deno",
  "test:cli-parity",
  "test:studio-unit",
  "test:conformance",
  "check:wasm-artifacts",
  "test:evidence",
]

[tasks."test:zig-unit"]
description = "Run the pinned capnp-zig unit tests for the generator, import paths, and reflection"
depends = ["build:zig"]
run = "zig test build/src/capnp-zig/src/main.zig --cache-dir build/zig/cache --test-filter 'main tests' --test-filter Generator.importPath --test-filter reflection"

[tasks."test:toolchain"]
description = "Compare compiler and generator behavior in Wasmtime, wazero, and the Deno browser shim"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:zig", "build:wazero"]
run = "deno test --allow-read --allow-write=build --allow-run --allow-env={{vars.suite_env}} tests/toolchain_test.ts"

[tasks."test:wire"]
description = "Check Zig wire-format conformance against the native compiler and the historical generator"
depends = ["build:native", "build:zig"]
run = "deno test --allow-read --allow-write=build --allow-run --allow-env={{vars.suite_env}} tests/wire_conformance_test.ts"

[tasks."test:reflection"]
description = "Check Zig binary schema reflection and generated views against native output"
depends = ["build:native", "build:zig"]
run = "deno test --allow-read --allow-write=build --allow-run --allow-env={{vars.suite_env}} tests/reflection/reflection_test.ts"

[tasks."test:generator-api"]
description = "Check the Zig generator API against native output"
depends = ["build:native", "build:zig"]
run = "deno test --allow-read --allow-write=build --allow-run --allow-env={{vars.suite_env}} tests/generator_api_test.ts"

[tasks."test:rpc-codegen"]
description = "Check Zig RPC code generation and its compiled consumers"
depends = ["build:native", "build:zig"]
run = "deno test --allow-read --allow-write=build --allow-run --allow-env={{vars.suite_env}} tests/rpc_codegen_test.ts"

[tasks."test:sdk-ts"]
description = "Run every TypeScript SDK test under sdk/typescript/ on the pinned Deno"
depends = ["build:wasm", "build:rust", "build:go", "build:zig"]
run = "deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read sdk/typescript/"

[tasks."test:features"]
description = "Compare the schema feature corpus across the SDK and native generators, then compile the output"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:zig"]
run = "deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read --allow-write=build --allow-run --allow-env={{vars.suite_env}} tests/schema_features_test.ts"

[tasks."test:sdk-go"]
description = "Run the Go SDK tests against the built Wasm commands and native oracle"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:zig"]
# Generated Wasm and shared fixtures live outside the Go module's cache inputs.
run = "go -C sdk/go test -count=1 -mod=readonly ./..."

[tasks."build:sdk"]
description = "Bundle the browser/Deno SDK, identical Wasm commands, and include schemas into dist"
depends = ["build:wasm", "build:rust", "build:go", "build:zig"]
run = "bash scripts/build-sdk.sh"

[tasks."browser:install"]
description = "Install pinned Chromium, Firefox, and WebKit into PLAYWRIGHT_BROWSERS_PATH (the project cache by default)"
run = 'deno run --config tests/browser/deno.json --frozen --allow-read --allow-write="$PLAYWRIGHT_BROWSERS_PATH" --allow-env --allow-sys --allow-net --allow-run=deno,cmake tests/browser/install.ts'

[tasks."test:browser"]
description = "Run offline SDK parity, cancellation, the termination acceptance, and the conformance corpus in Chromium, Firefox, and WebKit, all engines at once (tests/browser/README.md lists the deadline and job variables)"
depends = ["build:native", "build:sdk"]
run = "deno run --config tests/browser/deno.json --frozen --no-prompt --allow-read --allow-write=build --allow-run --allow-env --allow-sys --allow-net=127.0.0.1 tests/browser/run.ts"

[tasks."test:termination-canary"]
description = "Canary, not a gate: does Worker.terminate() stop a spinning JS, Wasm, or Wasm catch_all guest on the pinned Deno and the newest Deno release? (the newest release needs network; CAPNP_CANARY_LATEST=0 skips it)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
runtimes=("pinned=$(command -v deno)")
if [[ "${CAPNP_CANARY_LATEST:-1}" != 0 ]]; then
  version="$(curl -fsSL https://dl.deno.land/release-latest.txt)"
  [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected latest Deno version: $version" >&2; exit 1; }
  case "$(uname -s)-$(uname -m)" in
    Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
    Linux-aarch64 | Linux-arm64) target=aarch64-unknown-linux-gnu ;;
    Darwin-arm64) target=aarch64-apple-darwin ;;
    Darwin-x86_64) target=x86_64-apple-darwin ;;
    *) echo "no Deno release for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
  esac
  # Each run downloads, checks, and unpacks in a directory of its own, and
  # only a checked, fully unpacked download is renamed to the -verified
  # directory: a binary an older unchecked task left in deno-$version, an
  # interrupted download, and a concurrent run's bytes are never run.
  latest="build/test/termination-canary/deno-$version-verified"
  if [[ ! -x "$latest/deno" ]]; then
    mkdir -p build/test/termination-canary
    download="$(mktemp -d "build/test/termination-canary/deno-$version-download.XXXXXX")"
    trap 'rm -rf "$download"' EXIT
    curl -fsSL -o "$download/deno.zip" "https://dl.deno.land/release/$version/deno-$target.zip"
    # Check the archive against the release's own checksum file on GitHub,
    # not against the host that served it, before anything is unpacked.
    curl -fsSL -o "$download/deno.zip.sha256sum" "https://github.com/denoland/deno/releases/download/$version/deno-$target.zip.sha256sum"
    expected="$( { grep -Eo '[0-9a-fA-F]{64}' "$download/deno.zip.sha256sum" || true; } | head -n 1 | tr 'A-F' 'a-f')"
    actual="$(shasum -a 256 "$download/deno.zip" | cut -d ' ' -f 1)"
    if [[ -z "$expected" || "$actual" != "$expected" ]]; then
      echo "deno-$target.zip $version has sha256 $actual, but its release checksum file lists ${expected:-no digest}" >&2
      exit 1
    fi
    unzip -q "$download/deno.zip" -d "$download"
    # A concurrent run may have published its own verified download first.
    [[ -x "$latest/deno" ]] || { rm -rf "$latest"; mv "$download" "$latest"; }
  fi
  runtimes+=("latest=$latest/deno")
fi
deno run --allow-read --allow-write=build/test --allow-run tests/hosts/deno/worker-termination-canary.ts "${runtimes[@]}"
'''

[tasks."test:browser-bootstrap"]
description = "Verify the Playwright bootstrap permission boundary, the browser step deadlines, and the termination verdicts without launching browsers"
run = "deno test --config tests/browser/deno.json --frozen --no-prompt --allow-read --allow-env --allow-sys tests/browser/playwright_test.ts tests/browser/deadline_test.ts tests/browser/termination_test.ts"

[tasks."example:deno"]
description = "Generate Rust through the bundled SDK with no execution permissions (type-checks the example)"
depends = ["build:sdk"]
run = "deno run --check --no-prompt --allow-read=dist examples/deno.ts"

[tasks."example:browser"]
description = "Serve Schema Studio with its local compiler and generator assets (port 8080, or `-- <port>`)"
depends = ["build:studio"]
run = "deno run --allow-read=dist/studio --allow-net=127.0.0.1 scripts/serve-example.ts"

[tasks."build:studio"]
description = "Build the complete static Schema Studio website"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist/studio --allow-env=DENO_DIR --allow-run=deno scripts/build-studio.ts"

[tasks."test:studio"]
description = "Verify Schema Studio workflows and native output parity in real browsers"
depends = ["build:native", "build:studio"]
run = "deno run --config tests/browser/deno.json --frozen --no-prompt --allow-read --allow-write=build --allow-run --allow-env --allow-sys --allow-net=127.0.0.1 tests/browser/studio.ts"

[tasks."release:prepare"]
description = "Prepare a full SDK release candidate in dist/releases: archive, manifest, SBOM, notes, and SHA256SUMS (refuses a dirty tree)"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist --allow-run=git,go scripts/release.ts"

[tasks."test:package"]
description = "Verify reproducible candidate packaging and clean external Deno/Go consumers"
# test-package.ts prepares its own candidates under build/test/package (with
# --allow-dirty), so it runs on a dirty tree and never touches dist/releases;
# build:native is for the compiler-host gate it follows.
depends = ["build:native", "build:sdk", "test:compiler-host-package"]
run = "deno run --allow-read --allow-write=build --allow-run=deno,go,cmake,bash,wasmtime scripts/test-package.ts"

[tasks."test:launcher"]
description = "Check the packaged Wasmtime launcher (binary streams, filesystem roots, failures, and the conformance corpus) in a candidate prepared under build/test/launcher"
# A throwaway candidate of its own, like test:package's, so the check runs on a
# dirty tree and leaves dist/releases alone.
depends = ["build:sdk"]
run = [
  "deno run --allow-read --allow-write=build --allow-run=git,go scripts/release.ts --out build/test/launcher --allow-dirty --allow-existing-tag",
  "deno run --allow-read --allow-write=build --allow-run=bash,wasmtime tests/package/launcher.ts",
]

[tasks."release:tools"]
description = "Prepare a compiler-only (tools) release candidate in dist/releases for repository toolchain integrations"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist --allow-run=git,go scripts/release.ts --tools-only"

[tasks."release:compiler-host"]
description = "Prepare a compiler and TypeScript host release candidate in dist/releases, without language generators"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist --allow-run=git scripts/release.ts --compiler-host"

[tasks."test:compiler-host-package"]
description = "Verify compiler-host packaging and an offline external Deno worker consumer"
# The script prepares the compiler-host candidate itself (twice, for
# reproducibility) under build/test/compiler-host.
depends = ["build:native", "build:sdk"]
run = "deno run --allow-read --allow-write=build --allow-run=deno,cmake,build/native/bin/normalize-request,build/native/bin/capnp scripts/test-compiler-host-package.ts"

[tasks."check:links"]
description = "Check relative links and heading anchors in Markdown files outside ref/"
run = "deno run --allow-read scripts/check-links.ts"

[tasks."test:harness"]
description = "Self-check the shared Deno test harness under tests/lib (no build; the process test may run sh)"
run = [
  "deno test tests/lib/harness_test.ts",
  "deno test --allow-run=sh --allow-env={{vars.suite_env}} --allow-read=tests/lib tests/lib/process_test.ts",
]

[tasks."test:sdk-go-race"]
description = "Run the Go SDK concurrency, cancellation, and Close tests under the race detector"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:zig"]
run = "go -C sdk/go test -race -count=1 -mod=readonly -run 'TestCompiler|TestGenerate|TestCancellation|TestClose|TestSleeping|TestFilesystem|TestNew|TestEngine|TestStdio|TestMemory|TestCompilationCache|TestMaxConcurrentJobs|TestPreStartLimits|TestRequestBytes|TestOutput|TestStdioBudgets|TestErrorKeeps' ./..."

[tasks."test:cli-parity"]
description = "Compare the non-compile CLI (upstream capnp-test.sh, conversions, eval) with native on the launcher, Wasmtime, wazero, and the Deno host"
depends = ["build:native", "build:wasm", "build:wazero"]
run = "deno test --allow-read --allow-write=build --allow-run --allow-env={{vars.suite_env}} tests/cli_parity_test.ts"

[tasks."test:conformance"]
description = "Check the failure and limit conformance corpus (tests/fixtures/conformance) and the termination probe's guest against their sources, and run the TypeScript direct surface against the corpus; the other surfaces run it in their own suites"
depends = ["build:wasm", "build:rust", "build:go", "build:zig"]
run = "deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read --allow-write=build --allow-run=wasm-tools --allow-env={{vars.suite_env}} tests/conformance/conformance_test.ts tests/hosts/deno/worker-termination-guest_test.ts"

[tasks."test:studio-unit"]
description = "Run the Schema Studio state and workspace unit tests on the pinned Deno (no browser, no build)"
run = "deno test --config examples/browser/deno.json --frozen examples/browser/"

[tasks."mirror:zig"]
description = "Stage, check, verify, or lock the project's mirror release of the pinned Zig toolchain: stage | check | verify [<base-url>] | lock [--write]"
run = "deno run --allow-read --allow-write=build,mise.lock --allow-net --allow-env=MISE_URL_REPLACEMENTS,MISE_ZIG_USE_COMMUNITY_MIRRORS,MISE_SAFE scripts/mirror-zig.ts"

[tasks."check:zig-lock"]
description = "Check offline that mise.toml sends core:zig to the project's Zig mirror release with the community mirrors off, and that mise.lock pins every platform there with a sha256 and minisign provenance"
run = "deno run --allow-read=mise.toml,mise.lock,mise.local.toml,.mise.local.toml --allow-env=MISE_URL_REPLACEMENTS,MISE_ZIG_USE_COMMUNITY_MIRRORS,MISE_SAFE scripts/mirror-zig.ts check"

# Scheduled verification (.github/workflows/nightly.yml and supply-chain.yml).
# The tasks also run locally; they need network access.
[tasks."check:lock-urls"]
description = "HEAD-request every download URL recorded in mise.lock, and the .minisig beside each minisign-verified one"
run = "bash scripts/check-lock-urls.sh"

[tasks."test:browser-soak"]
description = "Repeat the browser suite (each round: parity, diagnostics, 20 cancellation-and-recovery cycles, the termination acceptance, and the conformance corpus per engine); CAPNP_SOAK_ROUNDS rounds, default 5"
depends = ["build:native", "build:sdk"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
rounds="${CAPNP_SOAK_ROUNDS:-5}"
for ((round = 1; round <= rounds; round++)); do
  echo "browser soak round $round of $rounds"
  deno run --config tests/browser/deno.json --frozen --no-prompt --allow-read --allow-write=build --allow-run --allow-env --allow-sys --allow-net=127.0.0.1 tests/browser/run.ts "$@"
done
'''

[tasks."test:sdk-ts-soak"]
description = "Repeat the TypeScript SDK tests (test:sdk-ts) on the pinned Deno: worker cancellation on timeout and abort, recovery, dispose; CAPNP_SOAK_ROUNDS rounds, default 5"
depends = ["build:wasm", "build:rust", "build:go", "build:zig"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
rounds="${CAPNP_SOAK_ROUNDS:-5}"
for ((round = 1; round <= rounds; round++)); do
  echo "SDK soak round $round of $rounds on $(deno --version | head -n 1)"
  deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read sdk/typescript/
done
'''

[tasks."test:sdk-go-floor"]
description = "Run the Go SDK vet and tests with the go.mod floor toolchain (downloaded through the module proxy; GOTOOLCHAIN is otherwise local)"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:zig"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
floor="$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' sdk/go/go.mod | head -n 1)"
[[ -n "$floor" ]] || { echo "no go directive in sdk/go/go.mod" >&2; exit 1; }
export GOTOOLCHAIN="go$floor"
go -C sdk/go version
go -C sdk/go vet -stdmethods=false ./...
go -C sdk/go test -count=1 -mod=readonly ./...
'''

[tasks."test:sdk-go-wazero-latest"]
description = "Drift signal, not a gate: build and test the Go SDK against the newest tagged wazero (when newer than the pin) and wazero main, then restore go.mod and go.sum"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:zig"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd sdk/go
restore() { git checkout -- go.mod go.sum; }
trap restore EXIT
module=github.com/tetratelabs/wazero
pinned="$(go list -m -f '{% raw %}{{.Version}}{% endraw %}' "$module")"
newest="$(go list -m -u -f '{% raw %}{{with .Update}}{{.Version}}{{end}}{% endraw %}' "$module")"
status=0
for target in "$newest" main; do
  if [[ -z "$target" ]]; then
    echo "no tagged wazero release is newer than the pin $pinned"
    continue
  fi
  go get "$module@$target"
  resolved="$(go list -m -f '{% raw %}{{.Version}}{% endraw %}' "$module")"
  if [[ "$resolved" == "$pinned" ]]; then
    echo "wazero@$target resolves to the pin $pinned; nothing new to test"
    restore
    continue
  fi
  echo "testing the Go SDK against wazero $resolved ($target)"
  if go test -count=1 ./...; then
    echo "PASS wazero $resolved ($target)"
  else
    echo "FAIL wazero $resolved ($target)"
    status=1
  fi
  restore
done
exit "$status"
'''

[tasks."audit:osv"]
description = "Scan the Go and Rust manifests with osv-scanner (network; the scanner is installed ad hoc, outside the project lock)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# An install from the project root would rewrite mise.lock, so the scanner
# runs from a scratch directory that has no project configuration.
scratch="$(mktemp -d)"
trap 'rm -rf "$scratch"' EXIT
mise --cd "$scratch" exec aqua:google/osv-scanner@2.6.0 -- osv-scanner scan source --format table \
  -L "$PWD/sdk/go/go.mod" -L "$PWD/generators/go/go.mod" \
  -L "$PWD/tests/hosts/wazero/go.mod" -L "$PWD/tests/consumers/go/go.mod" \
  -L "$PWD/generators/rust/Cargo.lock" -L "$PWD/tests/consumers/rust/Cargo.lock"
'''


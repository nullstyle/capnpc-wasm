min_version = "2026.9.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[settings.task]
run_auto_install = false

[tool_alias.wasi-sdk]
backend = "github:WebAssembly/wasi-sdk"

[tools]
# Native bootstrap and generated C++ checks. clangxx supplies the C++ driver.
clang = "23.1.0"
"conda:clangxx" = "23.1.0"
cmake = "4.4.3"
ninja = "1.13.2"
go = "1.27.1"
deno = "2.9.6"
# Match ref/capnp-zig/mise.toml when updating that reference.
zig = "0.17.0-dev.1683+5ceec001b"
wasm-tools = "1.258.0"
wasmtime = "48.0.1"
shellcheck = "0.11.0"
# Rust exposes Cargo's user bin directory; put it after managed binaries so
# previously installed Cargo commands cannot shadow wasm-tools or other pins.
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"], targets = ["wasm32-wasip1"] }

[tools.wasi-sdk]
version = "34"
version_prefix = "wasi-sdk-"
strip_components = 1
bin_path = "bin"
# Keep the SDK's cross-compilers off PATH; use `mise where wasi-sdk` explicitly.
filter_bins = ["wasm-ld"]

[tools.wasi-sdk.platforms]
# Static mappings also resolve correctly when locking for a different host.
linux-x64 = { asset_pattern = "wasi-sdk-*-x86_64-linux.tar.gz" }
linux-arm64 = { asset_pattern = "wasi-sdk-*-arm64-linux.tar.gz" }
macos-x64 = { asset_pattern = "wasi-sdk-*-x86_64-macos.tar.gz" }
macos-arm64 = { asset_pattern = "wasi-sdk-*-arm64-macos.tar.gz" }

[env]
CC = "clang"
CXX = "clang++"
CARGO_TARGET_DIR = "{{config_root}}/build/cargo"
DENO_DIR = "{{config_root}}/.cache/deno"
GOPATH = "{{config_root}}/.cache/go"
GOCACHE = "{{config_root}}/.cache/go-build"
GOTOOLCHAIN = "local"
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.cache/zig"
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.cache/playwright"

[tasks.setup]
description = "Initialize pinned references and verify installed tools (run mise install first)"
run = [{ task = "refs:sync" }, { task = "doctor" }]

[tasks."refs:sync"]
description = "Initialize top-level reference submodules at their recorded commits"
run = ["git submodule sync", "git -c submodule.recurse=false submodule update --init", "git -C ref/capnp-zig fetch --no-tags origin $(cat generators/zig/historical-reference)"]

[tasks."refs:status"]
description = "Show the exact reference checkouts"
run = "git submodule status"

[tasks.doctor]
description = "Check tool availability, Rust WASI target, SDK layout, and reference pins"
run = "bash scripts/doctor.sh"

[tasks.check]
description = "Check formatting, tooling, and native/Wasm parity across the test hosts"
run = [
  "shellcheck scripts/*.sh bin/capnp-wasm",
  "deno fmt --check README.md AGENTS.md ref/README.md patches/capnproto/README.md patches/capnp-zig/README.md generators/README.md generators/zig/README.md tests sdk examples scripts/*.ts",
  "deno lint tests sdk/typescript examples scripts/*.ts",
  "deno check --config tests/hosts/deno/deno.json --unstable-sloppy-imports tests/hosts/deno/main.ts",
  "go -C tests/hosts/wazero vet ./...",
  "go -C generators/go vet capnproto.org/go/capnp/v3/capnpc-go",
  "go -C sdk/go vet -stdmethods=false ./...",
  "deno check --config sdk/typescript/deno.json --unstable-sloppy-imports sdk/typescript/mod.ts sdk/typescript/worker.ts",
  "deno check --config tests/browser/deno.json --frozen tests/browser/test.ts tests/browser/install.ts tests/browser/run.ts tests/browser/studio.ts",
  "cargo fmt --manifest-path generators/rust/Cargo.toml -- --check",
  "cargo fmt --manifest-path tests/consumers/rust/Cargo.toml -- --check",
  "cargo clippy --locked --manifest-path generators/rust/Cargo.toml --all-targets -- -D warnings",
  "zig fmt --check generators/zig tests/consumers/zig tests/wire tests/reflection tests/generator_api tests/rpc_codegen",
  { task = "doctor" },
  { task = "test" },
]

[tasks."build:native"]
description = "Build the pristine upstream native tools and test oracle"
run = "bash scripts/build-native.sh"

[tasks."build:wasm"]
description = "Apply the WASI port to a disposable source copy and build command modules"
run = "bash scripts/build-wasm.sh"

[tasks.build]
description = "Build native reference tools and WASI command modules"
depends = ["build:native", "build:sdk"]

[tasks."build:rust"]
description = "Build the Rust generator as native and WASI commands"
run = "bash scripts/build-rust.sh"

[tasks."build:go"]
description = "Build the Go generator as native and WASI commands"
run = "bash scripts/build-go.sh"

[tasks."build:zig"]
description = "Build the pinned capnp-zig generator as native and WASI commands"
run = "bash scripts/build-zig.sh"

[tasks."check:zig-sync"]
description = "Verify prepared Zig sources and mirrored fixtures against the committed native manifest"
run = "deno run --allow-read --allow-run=git scripts/check-zig-sync.ts"

[tasks."build:wazero"]
description = "Build the test host from the pinned wazero reference"
run = "go -C tests/hosts/wazero build -mod=readonly -o ../../../build/hosts/wazero-run ."

[tasks.test]
description = "Compare compiler/generator behavior in Wasmtime, wazero, and the Deno browser shim"
depends = ["build:native", "build:wasm", "build:rust", "build:go", "build:zig", "build:wazero", "build:sdk"]
run = [
  "zig test build/src/capnp-zig/src/main.zig --cache-dir build/zig/cache --test-filter 'main tests' --test-filter Generator.importPath --test-filter reflection",
  "deno test --allow-read --allow-write=build --allow-run tests/toolchain_test.ts",
  "deno test --allow-read --allow-write=build --allow-run tests/wire_conformance_test.ts",
  "deno test --allow-read --allow-write=build --allow-run tests/reflection/reflection_test.ts",
  "deno test --allow-read --allow-write=build --allow-run tests/generator_api_test.ts",
  "deno test --allow-read --allow-write=build --allow-run tests/rpc_codegen_test.ts",
  "deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read sdk/typescript/sdk_test.ts",
  "deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read --allow-write=build --allow-run tests/schema_features_test.ts",
  # Generated Wasm and shared fixtures live outside the Go module's cache inputs.
  "go -C sdk/go test -count=1 -mod=readonly ./...",
]

[tasks."build:sdk"]
description = "Bundle the browser/Deno SDK, identical Wasm commands, and include schemas into dist"
depends = ["build:wasm", "build:rust", "build:go", "build:zig"]
run = "bash scripts/build-sdk.sh"

[tasks."browser:install"]
description = "Install pinned Chromium, Firefox, and WebKit into the project cache"
run = "deno run --config tests/browser/deno.json --frozen --allow-read --allow-write=.cache/playwright --allow-env --allow-sys --allow-net --allow-run=deno,cmake tests/browser/install.ts"

[tasks."test:browser"]
description = "Run offline SDK parity and cancellation in Chromium, Firefox, and WebKit"
depends = ["build:native", "build:sdk"]
run = "deno run --config tests/browser/deno.json --frozen --no-prompt --allow-read --allow-write=build --allow-run --allow-env --allow-sys --allow-net=127.0.0.1 tests/browser/run.ts"

[tasks."example:deno"]
description = "Generate Rust through the bundled SDK with no execution permissions"
depends = ["build:sdk"]
run = "deno run --no-prompt --allow-read=dist examples/deno.ts"

[tasks."example:browser"]
description = "Serve Schema Studio with its local compiler and generator assets"
depends = ["build:studio"]
run = "deno run --allow-read=dist/studio --allow-net=127.0.0.1:8080 scripts/serve-example.ts"

[tasks."build:studio"]
description = "Build the complete static Schema Studio website"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist/studio --allow-env=DENO_DIR --allow-run=deno scripts/build-studio.ts"

[tasks."test:studio"]
description = "Verify Schema Studio workflows and native output parity in real browsers"
depends = ["build:native", "build:studio"]
run = "deno run --config tests/browser/deno.json --frozen --no-prompt --allow-read --allow-write=build --allow-run --allow-env --allow-sys --allow-net=127.0.0.1 tests/browser/studio.ts"

[tasks."release:prepare"]
description = "Prepare a private versioned SDK archive with checksums and source/tool/reference provenance"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist --allow-run=git,go scripts/release.ts"

[tasks."test:package"]
description = "Verify reproducible candidate packaging and clean external Deno/Go consumers"
depends = ["release:prepare"]
run = [
  "deno run --allow-read --allow-write --allow-run=deno,go,cmake,bash,wasmtime scripts/test-package.ts",
  "deno run --allow-read --allow-write --allow-run scripts/test-compiler-host-package.ts",
]

[tasks."test:launcher"]
description = "Check packaged Wasmtime launcher binary streams, filesystem roots, and failures"
depends = ["release:prepare"]
run = "deno run --allow-read --allow-write=build --allow-run=bash,wasmtime tests/package/launcher.ts"

[tasks."release:tools"]
description = "Prepare a private compiler-only archive for repository toolchain integrations"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist --allow-run=git,go scripts/release.ts --tools-only"

[tasks."release:compiler-host"]
description = "Prepare a private compiler and TypeScript host archive without language generators"
depends = ["build:sdk"]
run = "deno run --allow-read --allow-write=dist --allow-run=git scripts/release.ts --compiler-host"

[tasks."test:compiler-host-package"]
description = "Verify compiler-host packaging and an offline external Deno worker consumer"
depends = ["release:compiler-host"]
run = "deno run --allow-read --allow-write --allow-run scripts/test-compiler-host-package.ts"

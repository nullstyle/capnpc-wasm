name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CARGO_BUILD_JOBS: "4"

jobs:
  check:
    name: Clean checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux host development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      # No build or project cache is restored: this also checks bootstrap and
      # source preparation from the committed tool lock and reference gitlinks.
      - name: Check native and Wasm parity, generated consumers, and SDKs
        run: mise run check
      - name: Verify release archive and external package consumers
        run: mise run test:package
      - name: Verify supported Deno worker execution and termination
        run: |
          # Keep this additional runtime outside the project's lockfile update.
          # mise 2026.9.1 otherwise prunes non-host WASI SDK option variants.
          mise --cd "$RUNNER_TEMP" install deno@2.6.8
          mise exec deno@2.6.8 -- deno test --config sdk/typescript/deno.json --unstable-sloppy-imports --allow-read sdk/typescript/sdk_test.ts
          mise exec -- deno run --allow-read --allow-write --allow-run scripts/test-compiler-host-package.ts "$(mise where deno@2.6.8)/bin/deno"
      - name: Verify checks leave tracked sources unchanged
        run: git diff --exit-code
      - name: Preserve failing test fixtures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-${{ matrix.os }}-fixtures
          path: build/test/
          if-no-files-found: ignore
          retention-days: 7

  browsers:
    name: Chromium, Firefox, and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux host development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      - name: Install system libraries with the pinned Playwright CLI
        run: >-
          mise exec -- deno run --config tests/browser/deno.json --frozen
          --allow-read --allow-env --allow-sys --allow-run --allow-net
          tests/browser/playwright.ts install-deps chromium firefox webkit
      - name: Verify the browser bootstrap permission boundary
        run: >-
          mise exec -- deno test --config tests/browser/deno.json --frozen
          --no-prompt --allow-read --allow-env --allow-sys
          tests/browser/playwright_test.ts
      - name: Install all pinned browser engines
        run: mise run browser:install chromium firefox webkit
      # One build feeds all engines. Each browser still runs in a separate
      # permission-revoking Deno process; no engine can silently be omitted.
      - name: Verify offline compilation, canonical requests, and cancellation
        run: mise run test:browser chromium firefox webkit
      - name: Verify Schema Studio workflows and native output parity
        run: mise run test:studio chromium firefox webkit
      - name: Preserve failing browser fixtures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-fixtures
          path: |
            build/test/browser-*/
            build/test/studio-*/
            dist/studio/
            dist/wasm/
            dist/typescript/
          if-no-files-found: ignore
          retention-days: 7

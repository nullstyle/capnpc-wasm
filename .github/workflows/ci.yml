# Every verification step calls a mise task, so the same commands run locally:
# `mise run ci` reproduces the check job, and the browsers job is
# test:browser-bootstrap, browser:install, test:browser and test:studio.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull-request runs share one group per ref and cancel superseded runs. Every
# other run (a push to main, a manual dispatch) gets its own group, so a new
# commit on main neither cancels nor replaces the run of the one before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CARGO_BUILD_JOBS: "4"

jobs:
  check:
    name: Clean checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Unpinned by design: Ubuntu's archive serves only the current build of
      # a package, so an exact version pin breaks at every security update.
      - name: Install Linux host development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      # Confine the token to this step, where the WASI SDK resolves through the
      # GitHub releases API. mise-action exports MISE_GITHUB_TOKEN to every later
      # step unless the variable is already set, so it is set here as step env.
      # Later steps run repository code without it: every tool, including the
      # locked Deno worker runtime (deno-worker), is installed by then.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      # mise-action restores its tool cache when mise.toml and mise.lock are
      # unchanged, so the tool downloads run only on a cache miss; the nightly
      # workflow bootstraps with cache: false. No build or project cache is
      # restored: source preparation from the reference gitlinks runs every
      # time.
      - name: Check native and Wasm parity, generated consumers, and SDKs
        run: mise run check
      # The wasm-digests job compares these between the two hosts.
      - name: Record the digests of the built Wasm modules
        run: |
          mkdir -p build/digests
          (cd dist/wasm && shasum -a 256 -- *.wasm) > build/digests/wasm.sha256
          cat build/digests/wasm.sha256
      - name: Upload the Wasm module digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-sha256-${{ matrix.os }}
          path: build/digests/wasm.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Verify release archive and external package consumers
        run: mise run test:package
      # The task checks the locked worker runtime (tool deno-worker, installed
      # above) against the version in sdk/typescript/environment.ts.
      - name: Verify supported Deno worker execution and termination
        run: mise run test:deno-worker
      - name: Run the Go SDK concurrency tests under the race detector
        run: mise run test:sdk-go-race
      - name: Verify checks leave the tree unchanged
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "checks left tracked or untracked changes:"
            echo "$changes"
            exit 1
          fi
      - name: Preserve failing test fixtures
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-${{ matrix.os }}-fixtures
          path: build/test/
          if-no-files-found: ignore
          retention-days: 7

  # Report-only: are the six Wasm modules byte-identical between the Linux
  # and macOS builds? Each host checks its own modules against the artifact
  # contract, and the build is reproducible on one host, but nothing yet
  # guarantees equality across hosts (different WASI SDK, Rust, Go, and Zig
  # host binaries, per-host build roots). A difference therefore fails this
  # job without blocking the run, so the evidence accumulates until the
  # cross-host claim can be made or withdrawn.
  wasm-digests:
    name: Wasm modules across Linux and macOS (report only)
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wasm-sha256-*
          path: digests
      - name: Compare the module digests
        run: |
          linux=digests/wasm-sha256-ubuntu-24.04/wasm.sha256
          macos=digests/wasm-sha256-macos-15/wasm.sha256
          for file in "$linux" "$macos"; do
            if [ ! -s "$file" ]; then
              echo "::warning::no digests in $file: its check job stopped before recording them"
              exit 1
            fi
          done
          {
            echo "| Module | Linux | macOS | Equal |"
            echo "| --- | --- | --- | --- |"
            join -1 2 -2 2 <(sort -k2 "$linux") <(sort -k2 "$macos") |
              while read -r module linux_digest macos_digest; do
                equal=no
                if [ "$linux_digest" = "$macos_digest" ]; then equal=yes; fi
                printf '| %s | %.16s | %.16s | %s |\n' \
                  "$module" "$linux_digest" "$macos_digest" "$equal"
              done
          } >> "$GITHUB_STEP_SUMMARY"
          if diff <(sort -k2 "$linux") <(sort -k2 "$macos"); then
            echo "The Linux and macOS builds produced byte-identical Wasm modules."
          else
            echo "::warning::the Linux and macOS builds produced different Wasm modules; see the job summary"
            exit 1
          fi

  browsers:
    name: Chromium, Firefox, and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux host development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      # Confine the token to this step, where the WASI SDK resolves through the
      # GitHub releases API. mise-action exports MISE_GITHUB_TOKEN to every later
      # step unless the variable is already set, so it is set here as step env.
      # Later steps run repository code without it: every tool, including the
      # locked Deno worker runtime (deno-worker), is installed by then.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      - name: Install system libraries with the pinned Playwright CLI
        run: >-
          mise exec -- deno run --config tests/browser/deno.json --frozen
          --allow-read --allow-env --allow-sys --allow-run --allow-net
          tests/browser/playwright.ts install-deps chromium firefox webkit
      - name: Verify the browser bootstrap permission boundary
        run: mise run test:browser-bootstrap
      - name: Install all pinned browser engines
        run: mise run browser:install chromium firefox webkit
      # One build feeds all engines. Each browser runs in its own
      # permission-revoking Deno process, all three at once, each under an
      # overall deadline; no engine can silently be omitted.
      - name: Verify offline compilation, canonical requests, cancellation, termination, and the conformance corpus
        run: mise run test:browser chromium firefox webkit
      - name: Verify Schema Studio workflows and native output parity
        run: mise run test:studio chromium firefox webkit
      - name: Verify checks leave the tree unchanged
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "checks left tracked or untracked changes:"
            echo "$changes"
            exit 1
          fi
      - name: Preserve failing browser fixtures
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-fixtures
          path: |
            build/test/browser-*/
            build/test/studio-*/
            dist/studio/
            dist/wasm/
            dist/typescript/
          if-no-files-found: ignore
          retention-days: 7

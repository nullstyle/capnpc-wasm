# Every verification step calls a mise task, so the same commands run locally:
# `mise run ci` reproduces the check job, and the browsers job is
# test:browser-bootstrap, browser:install, test:browser and test:studio.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull-request runs share one group per ref and cancel superseded runs. Every
# other run (a push to main, a manual dispatch) gets its own group, so a new
# commit on main neither cancels nor replaces the run of the one before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CARGO_BUILD_JOBS: "4"

jobs:
  check:
    name: Clean checkout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Unpinned by design: Ubuntu's archive serves only the current build of
      # a package, so an exact version pin breaks at every security update.
      - name: Install Linux host development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      # Confine the token to this step, where the WASI SDK resolves through the
      # GitHub releases API. mise-action exports MISE_GITHUB_TOKEN to every later
      # step unless the variable is already set, so it is set here as step env.
      # Later steps run repository code without it: every tool is installed by
      # then.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      # mise-action restores its tool cache when mise.toml and mise.lock are
      # unchanged, so the tool downloads run only on a cache miss; the nightly
      # workflow bootstraps with cache: false. No build or project cache is
      # restored: source preparation from the reference gitlinks runs every
      # time.
      - name: Check native and Wasm parity, generated consumers, and SDKs
        run: mise run check
      # The wasm-digests job compares these between the two hosts, and each
      # module's class, taken from the artifact contract's one list (`modules`
      # in scripts/check-wasm-artifacts.ts), tells it which modules may differ.
      # Neither step may fail this required job: the comparison is report-only.
      - name: Record the digests of the built Wasm modules
        continue-on-error: true
        run: |
          mkdir -p build/digests
          (cd dist/wasm && shasum -a 256 -- *.wasm) > build/digests/wasm.sha256
          mise exec -- deno eval --no-config --no-lock \
            'import { modules } from "./scripts/check-wasm-artifacts.ts";
            for (const [name, contract] of Object.entries(modules)) {
              console.log(name + ".wasm " + contract.class);
            }' > build/digests/wasm-classes.txt
          cat build/digests/wasm.sha256 build/digests/wasm-classes.txt
      - name: Upload the Wasm module digests
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-sha256-${{ matrix.os }}
          path: |
            build/digests/wasm.sha256
            build/digests/wasm-classes.txt
          if-no-files-found: error
          retention-days: 7
      - name: Verify release archive and external package consumers
        run: mise run test:package
      - name: Run the Go SDK concurrency tests under the race detector
        run: mise run test:sdk-go-race
      - name: Verify checks leave the tree unchanged
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "checks left tracked or untracked changes:"
            echo "$changes"
            exit 1
          fi
      - name: Preserve failing test fixtures
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-${{ matrix.os }}-fixtures
          path: build/test/
          if-no-files-found: ignore
          retention-days: 7

  # Report-only: are the Wasm modules byte-identical between the Linux and
  # macOS builds? Each host checks its own modules against the artifact
  # contract, and the build is reproducible on one host. The cpp class
  # (capnp, capnpc-c++, capnpc-capnp) keeps two libc++abi source paths that
  # differ between the WASI SDK's Linux and macOS tarballs
  # (sdkBuildPathPrefixes in scripts/check-wasm-artifacts.ts), so its modules
  # are expected to differ; a cpp module that matches is reported as a
  # notice. A difference in any other module, a module one host lacks or the
  # contract does not list, or a missing digest or class file fails this job
  # without blocking the run, so the evidence accumulates until the
  # cross-host claim for the generators can be made or withdrawn.
  wasm-digests:
    name: Wasm modules across Linux and macOS (report only)
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wasm-sha256-*
          path: digests
      - name: Compare the module digests
        run: |
          linux=digests/wasm-sha256-ubuntu-24.04
          macos=digests/wasm-sha256-macos-15
          missing=no
          for file in "$linux/wasm.sha256" "$linux/wasm-classes.txt" \
            "$macos/wasm.sha256" "$macos/wasm-classes.txt"; do
            if [ ! -s "$file" ]; then
              echo "::warning::no $file: its check job stopped before recording it"
              missing=yes
            fi
          done
          if [ "$missing" = yes ]; then exit 1; fi
          if ! cmp -s "$linux/wasm-classes.txt" "$macos/wasm-classes.txt"; then
            echo "::warning::the Linux and macOS check jobs recorded different module classes"
            exit 1
          fi
          # One row per module that either host built or the contract lists:
          # module, class, Linux digest, macOS digest, verdict.
          rows="$(awk '
            FNR == 1 { part++ }
            part == 1 { class[$1] = $2; seen[$1] = 1; next }
            part == 2 { linux[$2] = $1; seen[$2] = 1; next }
            { macos[$2] = $1; seen[$2] = 1 }
            END {
              for (module in seen) {
                c = (module in class) ? class[module] : "unlisted"
                l = (module in linux) ? linux[module] : "missing"
                m = (module in macos) ? macos[module] : "missing"
                if (l == "missing" && m == "missing") verdict = "unexpected: built on neither host"
                else if (l == "missing") verdict = "unexpected: missing on Linux"
                else if (m == "missing") verdict = "unexpected: missing on macOS"
                else if (c == "unlisted") verdict = "unexpected: not in the artifact contract"
                else if (l != m && c == "cpp") verdict = "expected: per-platform WASI SDK strings"
                else if (l != m) verdict = "unexpected: differs"
                else if (c == "cpp") verdict = "notice: equal"
                else verdict = "equal"
                printf "%s\t%s\t%s\t%s\t%s\n", module, c, l, m, verdict
              }
            }' "$linux/wasm-classes.txt" "$linux/wasm.sha256" "$macos/wasm.sha256" | sort)"
          {
            echo "| Module | Class | Linux | macOS | Result |"
            echo "| --- | --- | --- | --- | --- |"
            while IFS=$'\t' read -r module class l m verdict; do
              printf '| %s | %s | %.16s | %.16s | %s |\n' \
                "$module" "$class" "$l" "$m" "$verdict"
            done <<< "$rows"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          expected=0
          while IFS=$'\t' read -r module class l m verdict; do
            case "$verdict" in
              expected:*) expected=$((expected + 1)) ;;
              "notice: equal")
                echo "::notice::$module is byte-identical across the hosts although its $class class embeds per-platform WASI SDK strings" ;;
              equal) ;;
              unexpected:*)
                echo "::warning::$module ($class): $verdict (Linux $l, macOS $m)"
                status=1 ;;
              # A row with an empty field shifts the others: never let it pass.
              *)
                echo "::warning::unreadable comparison row for $module: class '$class', verdict '$verdict'"
                status=1 ;;
            esac
          done <<< "$rows"
          if [ "$status" = 0 ]; then
            echo "No unexpected difference: $expected cpp module(s) differ as expected (per-platform WASI SDK strings) and every other module is byte-identical; see the job summary."
          fi
          exit "$status"

  browsers:
    name: Chromium, Firefox, and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux host development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      # Confine the token to this step, where the WASI SDK resolves through the
      # GitHub releases API. mise-action exports MISE_GITHUB_TOKEN to every later
      # step unless the variable is already set, so it is set here as step env.
      # Later steps run repository code without it: every tool is installed by
      # then.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      - name: Install system libraries with the pinned Playwright CLI
        run: >-
          mise exec -- deno run --config tests/browser/deno.json --frozen
          --allow-read --allow-env --allow-sys --allow-run --allow-net
          tests/browser/playwright.ts install-deps chromium firefox webkit
      - name: Verify the browser bootstrap boundary, step deadlines, and termination verdicts
        run: mise run test:browser-bootstrap
      - name: Install all pinned browser engines
        run: mise run browser:install chromium firefox webkit
      # One build feeds all engines. Each browser runs in its own
      # permission-revoking Deno process, all three at once, each under an
      # overall deadline; no engine can silently be omitted.
      - name: Verify offline compilation, canonical requests, cancellation, termination, and the conformance corpus
        run: mise run test:browser chromium firefox webkit
      - name: Verify Schema Studio workflows and native output parity
        run: mise run test:studio chromium firefox webkit
      - name: Verify checks leave the tree unchanged
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "checks left tracked or untracked changes:"
            echo "$changes"
            exit 1
          fi
      - name: Preserve failing browser fixtures
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-fixtures
          path: |
            build/test/browser-*/
            build/test/studio-*/
            dist/studio/
            dist/wasm/
            dist/typescript/
          if-no-files-found: ignore
          retention-days: 7

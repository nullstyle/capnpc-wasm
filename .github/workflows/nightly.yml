# Scheduled verification that a push never exercises: a cold bootstrap from the
# committed lock with no tool cache on Linux and macOS, x64 and arm64, the
# browser suites on Linux and macOS, long cancellation soaks, the Go race
# detector, the go.mod floor toolchain, a drift check against newer wazero, a
# non-gating worker termination canary, the reachability of every locked
# download, the Go SDK tests on Windows, and the nightly-confidence ledger.
# Every other verification step calls a mise task, so it also runs locally.
name: Nightly

on:
  schedule:
    # Daily at 11:17 UTC, two hours after capnp-zig's nightly (09:17 UTC).
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      soak_rounds:
        description: Soak rounds (each round is 20 cancellation cycles per browser engine and the SDK suite on the pinned Deno)
        type: string
        default: "5"

permissions:
  contents: read

# Every run gets its own group: a scheduled run is never cancelled.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CARGO_BUILD_JOBS: "4"
  # Empty on a scheduled run, so the default applies there too.
  CAPNP_SOAK_ROUNDS: ${{ inputs.soak_rounds || '5' }}

jobs:
  bootstrap:
    name: Cold bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Per-push CI covers ubuntu-24.04 (Linux x64) and macos-15 (macOS
        # arm64); the nightly adds the other two hosts the lockfile supports
        # (decision D3 = A). macos-15-intel is the x86_64 build of the same
        # macOS 15 image, which GitHub keeps until August 2027; move to
        # macos-26-intel before it retires.
        os: [ubuntu-24.04, macos-15, ubuntu-24.04-arm, macos-15-intel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Unpinned by design: Ubuntu's archive serves only the current build of
      # a package, so an exact version pin breaks at every security update.
      - name: Install Linux host development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      # cache: false: unlike CI, no tool cache is restored, so every tool is
      # downloaded from its locked URL (the pruned Zig build from a community
      # mirror) and verified against mise.lock by `mise install --locked` in
      # the next step, which never rewrites the lock. The token is confined to
      # these two steps.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install: false
          cache: false
      # Stopgap for the Zig community mirror that serves no .minisig (see
      # ci.yml): install: false above and this retry go once mise.lock points
      # at the project's own Zig mirror.
      - name: Install the locked tools (up to three attempts)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::mise install --locked failed on attempt $attempt of 3; retrying in 15 s"
              sleep 15
            fi
          done
          echo "::error::mise install --locked failed three times"
          exit 1
      - name: Initialize only pinned top-level references
        run: mise run setup
      # The Intel runner (four x86_64 CPUs) is the slowest host, and each
      # load failure so far came from it running mise's default of eight tasks
      # at once: the harness's SIGTERM race (nightly 36120138448), an SDK
      # cancellation grace (36132427000), and a cold Zig consumer build past
      # its timeout (36141746707). With two tasks at once its check, about 17
      # minutes now, takes an estimated 25 to 45 (the tasks' logged durations
      # sum to 78 to 94 minutes), well inside the job's 90.
      - name: Run two mise tasks at once on the Intel runner
        if: matrix.os == 'macos-15-intel'
        run: echo "MISE_JOBS=2" >> "$GITHUB_ENV"
      - name: Check native and Wasm parity, generated consumers, and SDKs
        run: mise run check
      - name: Verify release archives and external package consumers
        run: mise run test:package
      - name: Run the Go SDK concurrency tests under the race detector
        run: mise run test:sdk-go-race
      - name: Verify checks leave the tree unchanged
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "checks left tracked or untracked changes:"
            echo "$changes"
            exit 1
          fi
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-bootstrap-${{ matrix.os }}-receipts
          path: |
            build/test/package-receipt.json
            build/test/compiler-host-package-*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve failing test fixtures
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-bootstrap-${{ matrix.os }}-fixtures
          path: build/test/
          if-no-files-found: ignore
          retention-days: 7

  browsers:
    name: Browsers and soak (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    # One engine at a time: with three at once on these four-CPU runners,
    # WebKit stalled recovering or starting workers (nightly 36112692524 soak
    # recovery, 36132427000 termination probe start, 36141746707
    # resource-limits worker init, all on Linux). Estimated, not measured:
    # nine one-round runs logged each engine's pass at 81 to 150 s, so a pass
    # in sequence takes at most about 400 s, and five soak rounds after
    # test:browser and test:studio keep the job near 45 minutes.
    env:
      CAPNP_BROWSER_JOBS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux host development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install: false
          cache: false
      # Stopgap for the Zig community mirror that serves no .minisig (see
      # ci.yml): install: false above and this retry go once mise.lock points
      # at the project's own Zig mirror.
      - name: Install the locked tools (up to three attempts)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::mise install --locked failed on attempt $attempt of 3; retrying in 15 s"
              sleep 15
            fi
          done
          echo "::error::mise install --locked failed three times"
          exit 1
      - name: Initialize only pinned top-level references
        run: mise run setup
      # Playwright's system libraries are a Linux concern; macOS runners carry
      # WebKit's frameworks already.
      - name: Install system libraries with the pinned Playwright CLI
        if: runner.os == 'Linux'
        run: >-
          mise exec -- deno run --config tests/browser/deno.json --frozen
          --allow-read --allow-env --allow-sys --allow-run --allow-net
          tests/browser/playwright.ts install-deps chromium firefox webkit
      - name: Verify the browser bootstrap boundary, step deadlines, and termination verdicts
        run: mise run test:browser-bootstrap
      # Every archive is verified against the digest recorded in install.ts.
      - name: Install all pinned browser engines
        run: mise run browser:install chromium firefox webkit
      - name: Verify offline compilation, canonical requests, and cancellation
        run: mise run test:browser chromium firefox webkit
      - name: Verify Schema Studio workflows and native output parity
        run: mise run test:studio chromium firefox webkit
      - name: Soak worker cancellation and recovery in every engine
        run: mise run test:browser-soak chromium firefox webkit
      - name: Soak the SDK suite on the pinned Deno
        run: mise run test:sdk-ts-soak
      - name: Verify checks leave the tree unchanged
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "checks left tracked or untracked changes:"
            echo "$changes"
            exit 1
          fi
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-browsers-${{ matrix.os }}-receipts
          path: |
            build/test/browser-verification-*/
            build/test/studio-*/receipt.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve failing browser fixtures
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-browsers-${{ matrix.os }}-fixtures
          path: |
            build/test/browser-*/
            build/test/studio-*/
            dist/studio/
            dist/wasm/
            dist/typescript/
          if-no-files-found: ignore
          retention-days: 7

  go-compat:
    name: Go floor and wazero drift
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux host development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      # The cold check is the bootstrap job's; this job may restore the cache.
      - id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install: false
      # Stopgap for the Zig community mirror that serves no .minisig (see
      # ci.yml): install: false above, this retry, and the cache save below go
      # once mise.lock points at the project's own Zig mirror.
      - name: Install the locked tools (up to three attempts)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::mise install --locked failed on attempt $attempt of 3; retrying in 15 s"
              sleep 15
            fi
          done
          echo "::error::mise install --locked failed three times"
          exit 1
      # install: false skips the action's own cache save; see ci.yml.
      - name: Save the mise tool cache after a miss
        if: steps.mise.outputs.cache-hit != 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      # The floor named by sdk/go/go.mod is a support claim; it blocks.
      - name: Test the Go SDK with the go.mod floor toolchain
        run: mise run test:sdk-go-floor
      # A drift signal, not a gate: newer wazero may change experimental APIs.
      - name: Test the Go SDK against newer wazero (non-blocking)
        continue-on-error: true
        run: mise run test:sdk-go-wazero-latest
      - name: Verify checks leave the tree unchanged
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "checks left tracked or untracked changes:"
            echo "$changes"
            exit 1
          fi
      - name: Preserve failing test fixtures
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-go-compat-fixtures
          path: build/test/
          if-no-files-found: ignore
          retention-days: 7

  # Non-gating upstream tracker: does Worker.terminate() stop a spinning JS,
  # Wasm, or Wasm catch_all guest on the pinned Deno and the newest Deno
  # release (GAP2-08)? The SDK stops guests itself and does not rely on
  # terminate(); this job notices an upstream fix or a Wasm-only regression
  # for docs/deno-worker-termination.md to record. A result that departs from
  # the recorded table fails the job without failing the nightly run.
  termination-canary:
    name: Deno worker termination canary (non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Only the pinned Deno, which the next step installs; --locked never
      # rewrites mise.lock. The canary task downloads the newest release itself
      # from dl.deno.land.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install: false
          cache: false
      # The stopgap retry every job that installs tools shares (see ci.yml),
      # although this job installs no Zig: install: false above and this retry
      # go once mise.lock points at the project's own Zig mirror.
      - name: Install the locked Deno (up to three attempts)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked deno; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::mise install --locked deno failed on attempt $attempt of 3; retrying in 15 s"
              sleep 15
            fi
          done
          echo "::error::mise install --locked deno failed three times"
          exit 1
      - name: Probe worker termination on each Deno runtime
        run: mise run test:termination-canary
      - name: Preserve the canary receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-termination-canary
          path: build/test/termination-canary.json
          if-no-files-found: ignore
          retention-days: 90

  lock-urls:
    name: Locked download URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Only the mise binary: the check needs bash and curl, no tools.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: false
          cache: false
      - name: Request every download URL recorded in mise.lock
        run: mise run check:lock-urls

  # Windows is supported for the Go SDK only (decision D3 = A); the build and
  # every other tool need Linux or macOS. This job builds the Wasm command
  # modules on Linux (build:sdk, no native oracle) for the Windows job.
  windows-go-modules:
    name: Wasm modules for the Windows Go SDK tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      go-version: ${{ steps.go.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux host development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config
      # The cold check is the bootstrap job's; this job may restore the cache.
      - id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install: false
      # Stopgap for the Zig community mirror that serves no .minisig (see
      # ci.yml): install: false above, this retry, and the cache save below go
      # once mise.lock points at the project's own Zig mirror.
      - name: Install the locked tools (up to three attempts)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::mise install --locked failed on attempt $attempt of 3; retrying in 15 s"
              sleep 15
            fi
          done
          echo "::error::mise install --locked failed three times"
          exit 1
      # install: false skips the action's own cache save; see ci.yml.
      - name: Save the mise tool cache after a miss
        if: steps.mise.outputs.cache-hit != 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
      - name: Initialize only pinned top-level references
        run: mise run setup
      - name: Build the Wasm command modules
        run: mise run build:sdk
      # The Windows job installs the same Go release as mise.toml; the lock
      # has no Windows entries, so mise does not run there.
      - name: Report the pinned Go release
        id: go
        run: |
          version="$(mise exec -- go env GOVERSION)"
          echo "version=${version#go}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-windows-go-modules
          path: |
            dist/wasm/capnp.wasm
            dist/wasm/capnpc-c++.wasm
            dist/wasm/capnpc-rust.wasm
            dist/wasm/capnpc-go.wasm
            dist/wasm/capnpc-zig.wasm
          if-no-files-found: error
          retention-days: 7

  # The Go SDK tests on Windows against the modules built above
  # (CAPNPC_WASM_TEST_MODULES), in a checkout, so a missing module or fixture
  # fails instead of skipping. Three tests compare with the native oracle, a
  # Linux or macOS build that cannot run here, so they are skipped; the
  # per-push jobs compare the same module bytes with native output.
  windows-go-sdk:
    name: Go SDK (windows-latest)
    needs: windows-go-modules
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The repository's .gitattributes keeps its own text files LF; this
      # keeps the two references' schemas byte-identical to Linux as well.
      - name: Check out text files unconverted
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The tests read c++.capnp from ref/capnproto and go.capnp from
      # ref/go-capnp, at their recorded commits.
      - name: Initialize the references the Go SDK tests read
        run: git submodule update --init --depth 1 -- ref/capnproto ref/go-capnp
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nightly-windows-go-modules
          path: ${{ runner.temp }}/wasm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.windows-go-modules.outputs.go-version }}
          cache: false
      - name: Test the Go SDK against the Linux-built modules
        env:
          CAPNPC_WASM_TEST_MODULES: ${{ runner.temp }}/wasm
          GOTOOLCHAIN: local
        run: >-
          go -C sdk/go test -count=1 -mod=readonly
          -skip '^TestCompiler$/^native_parity$|^TestSchemaFeatures$|^TestCompilerPathFixtureMatchesNative$'
          ./...

  # The nightly-confidence ledger (decision D5 = A): the streak of successful
  # scheduled runs of this workflow at the pinned ref/capnp-zig revision,
  # recomputed from the Actions API once the other jobs have finished. This
  # run is still in progress here, so the ledger counts the runs before it;
  # the next run, or `mise run audit:nightly` afterwards, counts this one.
  # The regenerated ledger is an artifact: CI never commits or pushes it.
  # Non-gating, so an API failure here cannot fail the run it measures.
  ledger:
    name: Nightly-confidence ledger (non-gating)
    needs:
      - bootstrap
      - browsers
      - go-compat
      - termination-canary
      - lock-urls
      - windows-go-modules
      - windows-go-sdk
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Only the pinned Deno, which the next step installs; --locked never
      # rewrites mise.lock.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install: false
          cache: false
      # The stopgap retry every job that installs tools shares (see ci.yml),
      # although this job installs no Zig: install: false above and this retry
      # go once mise.lock points at the project's own Zig mirror.
      - name: Install the locked Deno (up to three attempts)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked deno; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::mise install --locked deno failed on attempt $attempt of 3; retrying in 15 s"
              sleep 15
            fi
          done
          echo "::error::mise install --locked deno failed three times"
          exit 1
      - name: Recompute the ledger from this repository's scheduled runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run audit:nightly -- --repo "$GITHUB_REPOSITORY"
      - name: Validate the regenerated ledger against its schema
        run: mise run check:evidence
      - name: Report whether the committed ledger is current
        run: |
          if git diff --quiet -- docs/release-evidence/nightly-confidence.json; then
            echo "the committed ledger matches this run's computation"
          else
            git diff --stat -- docs/release-evidence/nightly-confidence.json
            echo "::notice::the committed nightly-confidence ledger is stale; commit the nightly-confidence artifact or the output of mise run audit:nightly"
          fi
      - name: Preserve the regenerated ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-confidence
          path: docs/release-evidence/nightly-confidence.json
          if-no-files-found: error
          retention-days: 90

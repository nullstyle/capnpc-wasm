# Weekly dependency and vulnerability monitoring. Every scan step calls a mise
# task, so the same checks run locally (`mise run audit:osv`,
# `audit:govulncheck`, `audit:advisories`); they need network access to
# OSV.dev, the Go vulnerability database, and the module proxy. Dependabot
# (.github/dependabot.yml) proposes the version updates themselves.
name: Supply chain

on:
  schedule:
    # Mondays at 12:41 UTC.
    - cron: "41 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Every run gets its own group: a scheduled run is never cancelled.
concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  vulnerabilities:
    name: OSV, govulncheck, and advisory pins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Only Go and Deno are needed: the next step installs just them with
      # `mise install --locked`, which never rewrites mise.lock, and
      # install_args keys the action's tool cache to them. The token is
      # confined to the installation steps; the scans run without it.
      - id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install_args: go deno
          install: false
      # The stopgap retry every job that installs tools shares (see ci.yml),
      # although this job installs no Zig: install: false above, this retry,
      # and the cache save below go once mise.lock points at the project's own
      # Zig mirror.
      - name: Install the locked Go and Deno (up to three attempts)
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if mise install --locked go deno; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::mise install --locked go deno failed on attempt $attempt of 3; retrying in 15 s"
              sleep 15
            fi
          done
          echo "::error::mise install --locked go deno failed three times"
          exit 1
      # install: false skips the action's own cache save; see ci.yml.
      - name: Save the mise tool cache after a miss
        if: steps.mise.outputs.cache-hit != 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2026.9.1
          install_args: go deno
      # generators/go replaces capnproto.org/go/capnp/v3 with the ref/go-capnp
      # checkout, so govulncheck needs the references initialized at their
      # gitlinks (git only; no tools involved).
      - name: Initialize only pinned top-level references
        run: mise run refs:sync
      # osv-scanner is not a project tool: audit:osv runs it ad hoc from a
      # scratch directory so the project lock is never rewritten. Installing
      # it here keeps the GitHub API token out of the scan step.
      - name: Install osv-scanner outside the project lock
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise --cd "$RUNNER_TEMP" install aqua:google/osv-scanner@2.6.0
      - name: Scan the Go and Rust manifests with osv-scanner
        run: mise run audit:osv
      - name: Run govulncheck over the Go SDK and generator modules
        run: mise run audit:govulncheck
      - name: Check the runtime pins and Deno lockfiles against OSV.dev
        run: mise run audit:advisories

  tool-pins:
    name: Newer tool releases (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: false
          cache: false
      # Not a mise task: `mise outdated` reads only mise.toml and the tool
      # registries, and the token stays with mise itself. Dependabot does not
      # cover mise tool pins, so this is the only signal for them.
      - name: List newer releases of the pinned tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Newer tool releases'
            echo
            echo '```'
            mise outdated
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

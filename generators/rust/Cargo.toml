[package]
name = "capnpc-wasm-rust-generator"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "capnpc-rust"
path = "src/main.rs"

[dependencies]
capnp = { path = "../../ref/capnproto-rust/capnp", version = "=0.27.2" }
capnpc = { path = "../../ref/capnproto-rust/capnpc", version = "=0.27.0" }

[profile.release]
lto = true
strip = true

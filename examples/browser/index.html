<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap'n Proto in a browser</title>
  <style>
  body {
    max-width: 64rem;
    margin: 3rem auto;
    padding: 0 1rem;
    font: 16px system-ui;
  }
  textarea {
    box-sizing: border-box;
    width: 100%;
    min-height: 12rem;
    font: 15px monospace;
    padding: 1rem;
  }
  button {
    padding: .6rem 1rem;
    margin: 1rem .5rem 0 0;
  }
  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding: 1rem;
    background: #f3f4f5;
  }
  </style>
  <h1>Cap'n Proto in a browser</h1>
  <p>Compile a schema once, then generate C++, Rust, or Go in a browser worker.</p>
  <div id="launch" hidden>
    <p>Start the example from the repository root:</p>
    <pre>mise run example:browser</pre>
    <p><a href="http://127.0.0.1:8080/examples/browser/">Open the running example</a></p>
  </div>
  <label for="schema">person.capnp</label>
  <textarea id="schema" spellcheck="false">@0xece4bf9c1f867623;
using Cxx = import "/capnp/c++.capnp";
$Cxx.namespace("example");
using Go = import "/go.capnp";
$Go.package("example");
$Go.import("example/person");

struct Person {
  name @0 :Text;
}</textarea>
  <div>
    <label for="language">Generate</label>
    <select id="language">
      <option value="all">All languages</option>
      <option value="cpp">C++</option>
      <option value="rust">Rust</option>
      <option value="go">Go</option>
    </select>
    <button id="generate" disabled>Generate</button>
    <button id="cancel" disabled>Cancel</button>
  </div>
  <p id="status" role="status">Loading Wasm modules…</p>
  <label for="files">Generated file</label>
  <select id="files" disabled></select>
  <button id="download" disabled>Download file</button>
  <pre id="output"></pre>
  <script>
  // This must be a classic inline script: browsers block module loading from file:.
  if (location.protocol === "file:") {
    document.querySelector("#launch").hidden = false;
    document.querySelector("#status").textContent =
      "Serve this example over HTTP to load its modules.";
  } else {
    const script = document.createElement("script");
    script.type = "module";
    script.src = "./main.js";
    script.onerror = () => {
      document.querySelector("#status").textContent =
        "Could not load the SDK. Run mise run example:browser from the repository root.";
    };
    document.body.append(script);
  }
  </script>
</html>
